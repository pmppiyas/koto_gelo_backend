services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kotogelo-api

    ports:
      - '3000:3000'

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: kotogelo-redis

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data:
